name: Deploy to Host C

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure SSH to use cloudflared
        env:
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "Host gcloud.26i.uk" >> ~/.ssh/config
          echo "    ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id $CF_CLIENT_ID --secret $CF_CLIENT_SECRET" >> ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: cloud
        run: |
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa $SSH_USER@gcloud.26i.uk "cd ~/bt_tndrs_etimad && git pull origin main && source venv/bin/activate && pip install -r requirements.txt && pkill -f 'python3 app.py' || true && nohup python3 app.py > app.log 2>&1 & && echo "0 9,11,13,15 * * * cd ~/bt_tndrs_etimad && ~/bt_tndrs_etimad/venv/bin/python3 ~/bt_tndrs_etimad/forsah_tenders.py >> ~/bt_tndrs_etimad/bt_etmd_tndrs_cron.log 2>&1
0 9,11,13,15 * * * cd ~/bt_tndrs_etimad && ~/bt_tndrs_etimad/venv/bin/python3 ~/bt_tndrs_etimad/etimad_tenders.py >> ~/bt_tndrs_etimad/etimad_tenders_cron.log 2>&1" | crontab -"

